<!DOCTYPE html>
<html>
<head>
    <title>Bello Cafe - Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>BELLO CAFE</h1>
    <h2>Our Menu</h2>

    <input type="text" id="search"
           placeholder="Search item..."
           onkeyup="searchItems()">

    <div class="menu">

        <div class="item">
            <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400">
            <h3>Coffee</h3>
            <p>Price: ₹100</p>
            <button onclick="addToCart('Coffee')">Add to Cart</button>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=400">
            <h3>Tea</h3>
            <p>Price: ₹70</p>
            <button onclick="addToCart('Tea')">Add to Cart</button>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400">
            <h3>Burger</h3>
            <p>Price: ₹180</p>
            <button onclick="addToCart('Burger')">Add to Cart</button>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400">
            <h3>Pizza</h3>
            <p>Price: ₹250</p>
            <button onclick="addToCart('Pizza')">Add to Cart</button>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400">
            <h3>French Fries</h3>
            <p>Price: ₹120</p>
            <button onclick="addToCart('French Fries')">Add to Cart</button>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400">
            <h3>Mocktail</h3>
            <p>Price: ₹150</p>
            <button onclick="addToCart('Mocktail')">Add to Cart</button>
        </div>

        <div class="item">
            <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=400">
            <h3>Dessert</h3>
            <p>Price: ₹130</p>
            <button onclick="addToCart('Dessert')">Add to Cart</button>
        </div>

    </div>

    <h2 id="cart">Cart: 0 items</h2>

    <script src="script.js"></script>

</body>
</html>
