<!DOCTYPE html>
<html>
<head>
    <title>Bello Cafe - Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>BELLO CAFE</h1>
    <h2>Our Menu</h2>

    <input type="text" id="search"
           placeholder="Search item..."
           onkeyup="searchItems()">

    <div class="menu">

        <!-- Coffee -->
        <div class="item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=400">
            </div>
            <div class="details">
                <h3>Coffee</h3>
                <p>Price: ₹100</p>
                <button onclick="addToCart('Coffee')">Add to Cart</button>
            </div>
        </div>

        <!-- Tea -->
        <div class="item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=400">
            </div>
            <div class="details">
                <h3>Tea</h3>
                <p>Price: ₹70</p>
                <button onclick="addToCart('Tea')">Add to Cart</button>
            </div>
        </div>

        <!-- Burger -->
        <div class="item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400">
            </div>
            <div class="details">
                <h3>Burger</h3>
                <p>Price: ₹180</p>
                <button onclick="addToCart('Burger')">Add to Cart</button>
            </div>
        </div>

        <!-- Pizza -->
        <div class="item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=400">
            </div>
            <div class="details">
                <h3>Pizza</h3>
                <p>Price: ₹250</p>
                <button onclick="addToCart('Pizza')">Add to Cart</button>
            </div>
        </div>

        <!-- French Fries -->
        <div class="item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400">
            </div>
            <div class="details">
                <h3>French Fries</h3>
                <p>Price: ₹120</p>
                <button onclick="addToCart('French Fries')">
                    Add to Cart
                </button>
            </div>
        </div>

        <!-- Mocktail -->
        <div class="item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400">
            </div>
            <div class="details">
                <h3>Mocktail</h3>
                <p>Price: ₹150</p>
                <button onclick="addToCart('Mocktail')">
                    Add to Cart
                </button>
            </div>
        </div>

        <!-- Dessert -->
        <div class="item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=400">
            </div>
            <div class="details">
                <h3>Dessert</h3>
                <p>Price: ₹130</p>
                <button onclick="addToCart('Dessert')">
                    Add to Cart
                </button>
            </div>
        </div>

        <!-- Pasta -->
        <div class="item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=400">
            </div>
            <div class="details">
                <h3>Pasta</h3>
                <p>Price: ₹220</p>
                <button onclick="addToCart('Pasta')">
                    Add to Cart
                </button>
            </div>
        </div>

        <!-- Sandwich -->
        <div class="item">
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=400">
            </div>
            <div class="details">
                <h3>Sandwich</h3>
                <p>Price: ₹160</p>
                <button onclick="addToCart('Sandwich')">
                    Add to Cart
                </button>
            </div>
        </div>

    </div>

    <h2 id="cart">Cart: 0 items</h2>

    <script src="script.js"></script>

</body>
</html>
